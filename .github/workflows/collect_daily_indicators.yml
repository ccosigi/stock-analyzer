
name: 📊 Daily Market Indicators Collector

on:
  schedule:
    # 화~토 오후 1시 30분 (KST) = UTC 04:30 → 미국 월~금 장 마감분 수집
    # CBOE Put/Call은 미 동부 밤 10시 전후(KST 다음날 낮 12시 전후) 게시되므로 그 이후로 설정
    - cron: '30 4 * * 2-6'   # 화~토 UTC 04:30 (KST 13:30)
  workflow_dispatch:          # 수동 실행 버튼 (테스트용)

jobs:
  collect-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          pip install yfinance pandas requests beautifulsoup4

      - name: 📊 Collect market indicators
        run: python collect_daily_indicators.py

      - name: 💾 Commit and push data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/market_indicators.csv
          # 변경사항 있을 때만 커밋 (데이터 없는 날 빈 커밋 방지)
          git diff --staged --quiet || git commit -m "📊 Daily indicators update: $(date +'%Y-%m-%d')"
          git push

